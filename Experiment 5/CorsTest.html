<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
</head>

<body>

    <h1>Profile</h1>

    <button onclick="getProfile()">
        Get Profile
    </button>

    <p id="result"></p>

    <script>

        function getProfile() {

            fetch("http://localhost:8080/profile")
                .then(response => response.text())
                .then(data => {

                    document.getElementById("result")
                            .innerText = data;

                })
                .catch(error => {

                    console.error(error);

                    document.getElementById("result")
                            .innerText =
                            "Request failed";

                });
        }

    </script>

</body>

</html>
